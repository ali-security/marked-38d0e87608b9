name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Spec file(s) / glob to run instead of the full suite; empty runs everything"
        required: false
        default: ""

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream pinned ['lts/*', 'node']; at the 2.0.6 release date (2021-05-27)
        # those floating labels resolved to Node 14 and Node 16, so they are pinned
        # here to keep the fork reproducible. Node 8 cannot run this suite at all:
        # the locked jasmine 3.7 loader uses dynamic import(), unsupported before
        # Node 12.17, so `npm run test:unit` dies with "Unexpected token import".
        node_version: [14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            echo "test-filter is set; the selected specs already ran in the previous step"
          else
            npm run test:specs
          fi
      - name: Pack 📦
        if: matrix.node_version == 14
        run: npm pack
      - name: Upload Package Tarball ⬆️
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
